[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msci-world-factor-backtest"
version = "0.1.0"
description = "Reproducible research engine for a leveraged MSCI World factor portfolio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.15,<3.13"
dependencies = [
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
]

[project.scripts]
build-factor-data = "factor_portfolio.data:main"
build-funding-data = "factor_portfolio.rates:main"
build-market-data = "factor_portfolio.market_data:main"
build-benchmark-analysis = "factor_portfolio.benchmark:main"
build-split-evaluation = "factor_portfolio.evaluation:main"
build-calibration-grid = "factor_portfolio.grid:main"
build-confirmation-evaluation = "factor_portfolio.confirmation:main"
build-investable-reference = "factor_portfolio.reference:main"
build-dimensional-comparison = "factor_portfolio.dimensional:main"

[project.optional-dependencies]
pdf = ["pypdf==6.19.0"]
layout-pdf = [
  "pypdf==6.19.0", "pdfplumber==0.11.9", "pdfminer.six==20251230",
  "pypdfium2==5.13.0", "Pillow==12.3.0", "charset-normalizer==3.5.1",
  "cryptography==50.0.2", "cffi==2.1.1", "pycparser==3.0",
]
plots = ["matplotlib==3.11.2"]
dev = [
  "pytest==9.0.3",
  "Pygments==2.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factor_portfolio = ["templates/*.md", "templates/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
